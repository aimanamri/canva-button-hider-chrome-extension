<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canva Button Hider</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <img src="icons/icon48.png" alt="" width="28" height="28" class="logo" />
    <div class="titles">
      <h1>Canva Button Hider</h1>
      <p class="tagline">Keeps "Send to teacher" out of sight</p>
    </div>
  </header>

  <main class="content">
    <section class="stage" aria-hidden="true">
      <div class="mock-toolbar">
        <span class="mock-dot"></span><span class="mock-dot"></span><span class="mock-dot"></span>
        <span class="mock-share">Share</span>
        <span id="mockButton" class="mock-send">Send to teacher</span>
      </div>
      <span class="spark spark-1"></span>
      <span class="spark spark-2"></span>
      <span class="spark spark-3"></span>
    </section>

    <label class="toggle-card" for="toggleInput">
      <span class="toggle-text">
        <span class="toggle-title">Hide the button</span>
        <span id="statusText" class="toggle-subtitle">Loading…</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="toggleInput" role="switch" disabled />
        <span class="slider" aria-hidden="true"></span>
      </span>
    </label>

    <p id="pageStatus" class="pill" role="status" data-state="idle">
      <span class="pill-dot" aria-hidden="true"></span>
      <span id="pageStatusText">Checking this tab…</span>
    </p>
  </main>

  <footer class="footer">
    <span>Shortcut <kbd>Alt</kbd><kbd>Shift</kbd><kbd>H</kbd></span>
    <span class="footer-right">
      <a href="https://github.com/aimanamri/canva-button-hider-chrome-extension" target="_blank" rel="noopener">GitHub</a>
      <span aria-hidden="true">·</span>
      v<span id="version"></span>
    </span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
